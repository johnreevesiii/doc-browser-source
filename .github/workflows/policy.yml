name: policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No ROM, no binaries, no dashes
        run: python scripts/check_no_rom.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Release manifest script tests
        run: node --test scripts/release-manifest.test.mjs
